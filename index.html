<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="manifest" href="/manifest.json" />
    <title>Planeje App</title>

    <!--
      As fontes da marca são servidas pelo PRÓPRIO app.

      Vinham de fonts.googleapis.com e api.fontshare.com. No navegador
      funciona; no APK a primeira pintura acontece na fonte do sistema e,
      sem rede, a marca nunca aparece — justamente no cenário que este app
      mais atende: mercado, fila, ônibus.

      Os arquivos ficam em public/fonts e são gerados por
      scripts/baixar-fontes.mjs. Só o subconjunto latino: 8 arquivos,
      216 kB.

      O preload é dos dois pesos que aparecem na PRIMEIRA tela — o corpo
      em Outfit 400 e os números em Cabinet 800. Sem ele o texto pisca na
      fonte do sistema antes de trocar.
    -->
    <link rel="preload" href="/fonts/outfit-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cabinet-grotesk-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fontes.css" />
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var ref = params.get('ref');
        if (ref) {
          localStorage.setItem('referral_code', ref.toUpperCase());
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
